server:
  port: 8082

spring:
  application:
    name: acquirer-service
  datasource:
    url: jdbc:h2:mem:acquirerdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.payment.acquirer: DEBUG