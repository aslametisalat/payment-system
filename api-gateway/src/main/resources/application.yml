server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: merchant-service
          uri: lb://merchant-service
          predicates:
            - Path=/api/merchants/**
        - id: acquirer-service
          uri: lb://acquirer-service
          predicates:
            - Path=/api/acquirers/**
        - id: issuer-service
          uri: lb://issuer-service
          predicates:
            - Path=/api/issuers/**,/api/cards/**
        - id: network-service
          uri: lb://network-service
          predicates:
            - Path=/api/network/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/api/settlements/**
        - id: reporting-service
          uri: lb://reporting-service
          predicates:
            - Path=/api/reports/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        - id: pos-terminal-service
          uri: lb://pos-terminal-service
          predicates:
            - Path=/api/pos/**
        - id: terminal-endpoints
          uri: lb://merchant-service
          predicates:
            - Path=/api/terminals/**
        # API Docs routes
        - id: merchant-service-docs
          uri: lb://merchant-service
          predicates:
            - Path=/v3/api-docs/merchant-service
          filters:
            - RewritePath=/v3/api-docs/merchant-service, /v3/api-docs
        - id: issuer-service-docs
          uri: lb://issuer-service
          predicates:
            - Path=/v3/api-docs/issuer-service
          filters:
            - RewritePath=/v3/api-docs/issuer-service, /v3/api-docs
        - id: acquirer-service-docs
          uri: lb://acquirer-service
          predicates:
            - Path=/v3/api-docs/acquirer-service
          filters:
            - RewritePath=/v3/api-docs/acquirer-service, /v3/api-docs
        - id: network-service-docs
          uri: lb://network-service
          predicates:
            - Path=/v3/api-docs/network-service
          filters:
            - RewritePath=/v3/api-docs/network-service, /v3/api-docs
        - id: transaction-service-docs
          uri: lb://transaction-service
          predicates:
            - Path=/v3/api-docs/transaction-service
          filters:
            - RewritePath=/v3/api-docs/transaction-service, /v3/api-docs
        - id: settlement-service-docs
          uri: lb://settlement-service
          predicates:
            - Path=/v3/api-docs/settlement-service
          filters:
            - RewritePath=/v3/api-docs/settlement-service, /v3/api-docs
        - id: reporting-service-docs
          uri: lb://reporting-service
          predicates:
            - Path=/v3/api-docs/reporting-service
          filters:
            - RewritePath=/v3/api-docs/reporting-service, /v3/api-docs
        - id: notification-service-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    urls:
      - name: merchant-service
        url: /v3/api-docs/merchant-service
      - name: issuer-service  
        url: /v3/api-docs/issuer-service
      - name: acquirer-service
        url: /v3/api-docs/acquirer-service
      - name: network-service
        url: /v3/api-docs/network-service
      - name: transaction-service
        url: /v3/api-docs/transaction-service
      - name: settlement-service
        url: /v3/api-docs/settlement-service
      - name: reporting-service
        url: /v3/api-docs/reporting-service
      - name: notification-service
        url: /v3/api-docs/notification-service
  api-docs:
    enabled: true
  use-management-port: false
