server:
  port: 8084

spring:
  application:
    name: network-service
  datasource:
    url: jdbc:h2:mem:networkdb
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

payment:
  security:
    jwt-secret: "demo-only-hmac-signing-secret-replace-with-real-key-vault-value-1234567890"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # No Zipkin server runs anywhere in this project - see
      # merchant-service's application.yml for why that's fine.
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.payment.network: DEBUG
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"