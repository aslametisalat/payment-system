server:
  port: 8084

spring:
  application:
    name: network-service
  datasource:
    url: jdbc:h2:mem:networkdb
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.payment.network: DEBUG