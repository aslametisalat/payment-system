server:
  port: 8091

spring:
  application:
    name: pos-terminal-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

feign:
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 3000

# DEMO values only - a real terminal reads these from an HSM/key-management
# service at runtime, never from a config file in source control. Must
# match issuer-service's payment.security.* values (pin-decryption-key
# there is this pin-encryption-key's counterpart) - this simulates the two
# ends of the same symmetric key.
payment:
  security:
    pin-encryption-key: "0123456789ABCDEF"
    mac-key: "FEDCBA9876543210"
    card-master-key: "0123456789ABCDEF"
    jwt-secret: "demo-only-hmac-signing-secret-replace-with-real-key-vault-value-1234567890"

resilience4j:
  circuitbreaker:
    instances:
      transaction-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      # Safe specifically because every call here carries a STAN/RRN-derived
      # idempotency key - see POSTransactionService.resilientAuthorize().
      transaction-service:
        max-attempts: 2
        wait-duration: 300ms

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # No Zipkin server runs anywhere in this project - the exporter fails
      # to reach it silently and every request still gets a trace ID
      # visible right here in the console pattern below, and (via Feign's
      # automatic propagation) in transaction-service's logs too - the same
      # ID, letting you follow one transaction across both services without
      # a Zipkin UI. Point this at a real collector to get that UI as well.
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    com.payment: DEBUG
    com.payment.pos: DEBUG
    com.payment.security: DEBUG
    com.payment.iso8583: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"